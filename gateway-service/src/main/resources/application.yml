server:
  port: 8080
spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: auth-api
          uri: lb://AUTH-SERVICE
          predicates: [ Path=/api/auth/** ]
        - id: customer-api
          uri: lb://CUSTOMER-SERVICE
          predicates: [ Path=/api/customers/** ]
        - id: account-api
          uri: lb://ACCOUNT-SERVICE
          predicates: [ Path=/api/accounts/** ]
        - id: transaction-api
          uri: lb://TRANSACTION-SERVICE
          predicates: [ Path=/api/transactions/** ]
        - id: fraud-api
          uri: lb://FRAUD-DETECTION-SERVICE
          predicates: [ Path=/api/fraud/** ]
        - id: auth-docs
          uri: lb://AUTH-SERVICE
          predicates: [ Path=/auth-service/v3/api-docs ]
          filters: [ StripPrefix=1 ]
        - id: discovery-docs
          uri: lb://DISCOVERY-SERVICE
          predicates: [ Path=/discovery-service/v3/api-docs ]
          filters: [ StripPrefix=1 ]
        - id: customer-docs
          uri: lb://CUSTOMER-SERVICE
          predicates: [ Path=/customer-service/v3/api-docs ]
          filters: [ StripPrefix=1 ]
        - id: account-docs
          uri: lb://ACCOUNT-SERVICE
          predicates: [ Path=/account-service/v3/api-docs ]
          filters: [ StripPrefix=1 ]
        - id: transaction-docs
          uri: lb://TRANSACTION-SERVICE
          predicates: [ Path=/transaction-service/v3/api-docs ]
          filters: [ StripPrefix=1 ]
        - id: fraud-docs
          uri: lb://FRAUD-DETECTION-SERVICE
          predicates: [ Path=/fraud-detection-service/v3/api-docs ]
          filters: [ StripPrefix=1 ]
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: discovery-service
        url: /discovery-service/v3/api-docs
      - name: auth-service
        url: /auth-service/v3/api-docs
      - name: customer-service
        url: /customer-service/v3/api-docs
      - name: account-service
        url: /account-service/v3/api-docs
      - name: transaction-service
        url: /transaction-service/v3/api-docs
      - name: fraud-detection-service
        url: /fraud-detection-service/v3/api-docs
security:
  jwt:
    secret: ${JWT_SECRET}