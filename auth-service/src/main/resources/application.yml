server:
  port: 8081
spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000
  otp:
    code: ${OTP_CODE}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    analyst-email: ${BOOTSTRAP_ANALYST_EMAIL:}
    analyst-password: ${BOOTSTRAP_ANALYST_PASSWORD:}